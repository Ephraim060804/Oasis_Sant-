<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>{% block Title %}INITTRUNK{% endblock %}</title>
    
    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1fdf2;
            padding-top: 80px; 
            min-height: 100vh;
        }

  
        header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            width: 100%;
            display: flex;
            justify-content: center;
            background-color: white;
            box-shadow: 4px 8px 12px #baf8bd;
            border-radius: 0 0 20px 20px;
            padding: 10px;
        }

        header :hover {
            color: #018d08;
        }

        a {
            font-family: monospace;
            font-weight: bold;
            text-decoration: none;
            font-size: 19px;
            color: rgb(78, 77, 77);
        }

        .liens nav {
            display: flex;
            justify-content: center;
            gap: 40px;
            text-transform: capitalize;
        }

     
        .connexion {
            margin-top: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            
        }

        .connexion .CLIC {
            display: inline-block;
            padding: 8px 15px;
            box-shadow: 2px 4px 8px #baf8bd;
            border-radius: 50px;
            transition: transform 1s ease, box-shadow 0.3s ease;
            background: white;
            flex-shrink: 0;
        }

        .connexion .CLIC:hover {
            transform: translateY(-10px);
            color: #018d08;
            border: 1px solid #018d08;
            box-shadow: 2px 4px 8px #97fa9c;
        }

        .connexion .CLIC:hover a {
            color: #018d08;
        }
        .connexion .CLIC:focus a{
                 border: 1px solid #018d08;
                 outline: 3px solid blue;

        }

      
        @media screen and (max-width: 1024px) {
            .connexion {
                gap: 12px;
            }

            .connexion .CLIC {
                padding: 8px 18px;
                font-size: 16px;
            }
        }

        @media screen and (max-width: 768px) {
            body {
                padding-top: 70px;
            }

            header {
                padding: 8px;
                border-radius: 0 0 15px 15px;
            }

            .liens nav {
                gap: 25px;
                flex-wrap: wrap;
                justify-content: center;
            }

            a {
                font-size: 16px;
            }

            .connexion {
                margin-top: 30px;
                gap: 10px;
                padding: 0 15px;
            }

            .connexion .CLIC {
                padding: 7px 14px;
                font-size: 14px;
                flex: 1 1 auto;
                min-width: 100px;
                text-align: center;
            }
        }

       
        @media screen and (max-width: 480px) {
            body {
                padding-top: 60px;
            }

            header {
                padding: 6px;
                border-radius: 0 0 10px 10px;
            }

            .liens nav {
                gap: 15px;
            }

            a {
                font-size: 13px;
            }

            .connexion {
                margin-top: 20px;
                gap: 8px;
                padding: 0 10px;
            }

            .connexion .CLIC {
                padding: 6px 12px;
                font-size: 12px;
                min-width: 80px;
            }
        }
        .deco {
            padding: 50px;
            
        }
    </style>
</head>
<body>
    <header>
        <div class="liens">
            <nav>
                <a href="{{ url_for('Index') }}#services">Services</a>
                <a href="{{ url_for('Index') }}#contact">Contact</a>
            </nav>
        </div>
    </header>

    <div class="connexion">
        <div class="CLIC">
            <a href="{{ url_for('Login') }}">Login</a>
        </div>
        <div class="CLIC">
            <a href="{{ url_for('Profil') }}">Profil</a>
        </div>
        <div class="CLIC">
            <a href="{{ url_for('Index')}}">Accueil</a>
        </div>
        <div class="CLIC">
            <a href="{{ url_for('Pharmacie') }}">Phrarmacie</a>
        </div>
        <div class="CLIC">
            <a href="{{ url_for('Consultation') }}">Consultation</a>
        </div>
    </div>
    <div class="deco">
        <hr>
        <hr>
        <hr>
        <hr>
    </div>
    <div class="container">
        
        <main>
            {% block Contener %}
            
            

            {% endblock %}
        </main>
    </div>
</body>
</html>
